name: YOUB TV Auto-Scraper

on:
  schedule:
    - cron: '* * * * *' # يعمل تلقائياً كل دقيقة
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Bot Script
        run: python bot.py

      - name: Commit and Push JSON Updates
        run: |
          git config --global user.name "YOUB Bot Automation"
          git config --global user.email "bot@youbtv.com"
          git add matches.json news.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "🤖 Auto-update matches & news [skip ci]" && git push)
