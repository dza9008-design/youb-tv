<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القنوات - YOUB TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            border-right: 4px solid #e50914;
            padding-right: 12px;
        }
        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .channel-card {
            background: linear-gradient(145deg, #15161d, #1a1b24);
            border-radius: 14px;
            padding: 22px 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .channel-card:hover {
            transform: translateY(-5px);
            border-color: #e50914;
            box-shadow: 0 12px 30px rgba(229, 9, 20, 0.25);
        }
        .channel-logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .channel-logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
        }
        .channel-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }
        .back-home {
            color: #ccc;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-home:hover {
            color: #e50914;
        }
    </style>
</head>
<body>

    <!-- هيدر الصفحة -->
    <header class="main-header" style="background: rgba(15,16,21,0.95); display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 1000;">
        <a href="index.html" class="logo-box" style="background: transparent; color: #fff; font-size: 22px; font-weight: 800; text-decoration: none;">
            YOUB <span style="color: #e50914;">TV</span>
        </a>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
    </header>

    <!-- المحتوى -->
    <div class="container">
        <div class="section-title" id="pageTitle">قائمة القنوات</div>
        <div class="grid-channels" id="channelsGrid">
            <!-- يتم تعبئة القنوات تلقائياً هنا عبر الجافاسكريبت بناءً على القسم المطلوب -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const category = urlParams.get('cat');

            const titleElement = document.getElementById('pageTitle');
            if (category === 'sports') titleElement.textContent = 'القنوات الرياضية';
            else if (category === 'news') titleElement.textContent = 'القنوات الإخبارية';
            else if (category === 'general') titleElement.textContent = 'القنوات العامة';

            try {
                // جلب بيانات القنوات من ملف channels.json الذي يحدده البوت
                const response = await fetch('./channels.json');
                const channels = await response.json();

                const grid = document.getElementById('channelsGrid');
                grid.innerHTML = '';

                // تصفية القنوات حسب القسم المحدد في الرابط
                const filteredChannels = category ? channels.filter(c => c.category === category) : channels;

                if (filteredChannels.length === 0) {
                    grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center;">لا توجد قنوات متاحة في هذا القسم حالياً.</p>';
                    return;
                }

                // عرض القنوات بشكل ديناميكي احترافي
                filteredChannels.forEach(channel => {
                    const card = document.createElement('div');
                    card.className = 'channel-card';
                    card.onclick = () => {
                        window.location.href = `./play.html?id=${channel.id}&title=${encodeURIComponent(channel.name)}`;
                    };
                    card.innerHTML = `
                        <div class="channel-logo-wrapper">
                            <img src="${channel.logo}" alt="${channel.name}" class="channel-logo">
                        </div>
                        <div class="channel-name">${channel.name}</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error("خطأ في جلب القنوات:", error);
            }
        });
    </script>
</body>
</html>
