<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - YOUB TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0b0c10; color: #fff; font-family: system-ui, -apple-system, sans-serif; margin: 0; }
        .live-container { max-width: 950px; margin: 20px auto; padding: 15px; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
        video { width: 100%; height: 100%; object-fit: contain; }
        .channel-info { background: #1a1b22; padding: 20px; border-radius: 12px; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; border: 1px solid #2a2b36; }
        .channel-title { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 12px; color: #fff; }
        .live-badge { background: #e50914; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; margin: 20px 25px 0 25px; font-size: 15px; background: rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 8px; transition: 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .unmute-btn { background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .status-msg { text-align: center; color: #10b981; font-size: 13px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>

    <div class="live-container">
        <div class="player-box">
            <video id="videoPlayer" controls autoplay muted playsinline></video>
        </div>
        
        <div class="status-msg" id="playerStatus">جاري تشغيل بث المباراة...</div>

        <div class="channel-info">
            <div class="channel-title">
                <span class="live-badge">LIVE</span>
                <span id="channelName">البث المباشر للمباراة</span>
            </div>
            <button class="unmute-btn" id="unmuteBtn" onclick="toggleMute()">
                <i class="fa-solid fa-volume-xmark"></i> تفعيل الصوت
            </button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const statusMsg = document.getElementById('playerStatus');
        const unmuteBtn = document.getElementById('unmuteBtn');

        function toggleMute() {
            if (video.muted) {
                video.muted = false;
                unmuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> كتم الصوت';
                unmuteBtn.style.background = '#10b981';
            } else {
                video.muted = true;
                unmuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> تفعيل الصوت';
                unmuteBtn.style.background = '#e50914';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const matchTitle = urlParams.get('title');
            const streamUrl = urlParams.get('stream');

            if (matchTitle) {
                document.getElementById('channelName').textContent = decodeURIComponent(matchTitle);
            }

            // استقبال الرابط القادم من المباراة حصرياً ودون استخدام روابط تجريبية خارجية
            const videoSrc = streamUrl ? decodeURIComponent(streamUrl) : "";

            if (!videoSrc) {
                statusMsg.textContent = "⚠️ تنبيه: لم يتم العثور على رابط بث لهذه المباراة";
                statusMsg.style.color = "#e50914";
                return;
            }

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    statusMsg.textContent = "✅ البث المباشر يعمل الآن بكفاءة";
                    video.play().catch(e => {
                        statusMsg.textContent = "اضغط على زر التشغيل داخل الفيديو لبدء العرض";
                    });
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        statusMsg.textContent = "⚠️ عذراً، رابط البث الحالي متوقف مؤقتاً من المصدر";
                        statusMsg.style.color = "#e50914";
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        });
    </script>
</body>
</html>
