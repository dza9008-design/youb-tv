<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أخبار المباريات - YOUB TV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 800px; margin: 25px auto; padding: 0 15px; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #fff; border-right: 4px solid #e50914; padding-right: 12px; }
        .news-card { background: linear-gradient(145deg, #15161d, #1a1b24); border-radius: 14px; overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
        @media(min-width: 600px) { .news-card { flex-direction: row; } }
        .news-img { width: 100%; height: 180px; object-fit: cover; }
        @media(min-width: 600px) { .news-img { width: 240px; height: auto; } }
        .news-content { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .news-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .news-summary { font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.5; }
        .news-time { font-size: 11px; color: #e50914; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .back-home { color: #ccc; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
    </style>
</head>
<body>

    <header class="main-header" style="background: rgba(15,16,21,0.95); display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 1000;">
        <a href="index.html" class="logo-box" style="background: transparent; color: #fff; font-size: 22px; font-weight: 800; text-decoration: none;">
            YOUB <span style="color: #e50914;">TV</span>
        </a>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
    </header>

    <div class="container">
        <div class="section-title">آخر الأخبار الرياضية والمباريات</div>
        <div id="newsContainer">
            <p style="text-align: center; color: #888;">جاري جلب آخر الأخبار عبر البوت...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('./news.json');
                const newsList = await response.json();
                
                const container = document.getElementById('newsContainer');
                container.innerHTML = '';

                newsList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <img src="${item.image}" alt="${item.title}" class="news-img">
                        <div class="news-content">
                            <div>
                                <div class="news-title">${item.title}</div>
                                <div class="news-summary">${item.summary}</div>
                            </div>
                            <div class="news-time"><i class="fa-regular fa-clock"></i> ${item.time}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في جلب الأخبار:", error);
            }
        });
    </script>
</body>
</html>
